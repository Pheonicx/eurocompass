name: EuroCompass v2 Collection

# The REAL v2 collection workflow -- runs scripts/run_v2_collection.py
# (not a diagnostic script) and commits its output for real. Distinct
# from Test v2 Full Pipeline End-to-End and Test v2 Live Collection,
# both of which are manual-trigger-only diagnostics that deliberately
# never write to the real v2_history/ or v2_exports/.
#
# Deliberately separate from v1's "EuroCompass Automatic Update"
# workflow and commits to v2-dev, never main -- v2 is not live yet.
# See V2_PROGRESS.md for the decision to start real collection before
# merging v2-dev to main, so historical charts and the forecast section
# have real depth by the time that merge happens.

on:
  workflow_dispatch:

  schedule:
    # Every hour, same cadence as v1's live collection.
    - cron: "20 * * * *"  # offset from v1's "0 * * * *" so the two workflows' Playwright runs don't contend for the same runner minute

concurrency:
  group: eurocompass-v2-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout v2-dev branch
        uses: actions/checkout@v4
        with:
          ref: v2-dev

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Install Playwright browser (needed for City Bank)
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Run v2 collection cycle
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_v2_collection.py

      - name: 📤 Commit and push results to v2-dev
        if: always()
        # `if: always()` matters here specifically: even a partial cycle
        # (some banks failing) still writes real, valid updates to the
        # banks that succeeded, and those updates are worth keeping —
        # this must not be skipped just because the collection step
        # above logged rejections or warnings.
        run: |
          git config user.name "EuroCompass v2 Bot"
          git config user.email "eurocompass-v2-bot@users.noreply.github.com"
          git add v2_history/ v2_exports/
          if git diff --cached --quiet; then
            echo "No changes to commit this cycle."
          else
            git commit -m "v2 collection: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:v2-dev
          fi
